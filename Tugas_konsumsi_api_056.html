<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset, Mahasiswa & Peminjaman</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Tahoma', sans-serif;
            padding: 20px;
        }

        .table-container,
        .form-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: white;
            padding: 20px;
        }

        .form-container {
            margin-top: 20px;
            display: none;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .table thead th {
            background-color: #343a40;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">

        <!-- Menu tab -->
        <ul class="nav nav-pills mb-3">
            <li class="nav-item"><button class="nav-link active" id="tab-asset" onclick="showPage('asset')">Master Asset</button></li>
            <li class="nav-item"><button class="nav-link" id="tab-mahasiswa" onclick="showPage('mahasiswa')">Master Mahasiswa</button></li>
            <li class="nav-item"><button class="nav-link" id="tab-peminjaman" onclick="showPage('peminjaman')">Transaksi Peminjaman</button></li>
        </ul>

        <!-- ================= MASTER ASSET ================= -->
        <div id="page-asset">
            <div class="table-container">
                <h1>Daftar Asset</h1>
                <button class="btn btn-primary mb-3" onclick="tambahAsset()">+ Add Data</button>
                <table id="tabel-asset" class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Asset</th>
                            <th>Kategori</th>
                            <th>Jumlah</th>
                            <th>Kondisi</th>
                            <th>Lokasi</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="form-container" id="box-asset">
                <h3 id="judul-asset">Tambah Asset</h3>
                <form id="form-asset">
                    <div class="mb-3">
                        <label class="form-label">Nama Asset</label>
                        <input type="text" class="form-control" id="asset-nama" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kategori</label>
                        <input type="text" class="form-control" id="asset-kategori" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jumlah</label>
                        <input type="number" class="form-control" id="asset-jumlah" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Kondisi</label>
                        <select class="form-control" id="asset-kondisi">
                            <option value="Baik">Baik</option>
                            <option value="Rusak Ringan">Rusak Ringan</option>
                            <option value="Rusak Berat">Rusak Berat</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lokasi</label>
                        <input type="text" class="form-control" id="asset-lokasi" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-control" id="asset-status">
                            <option value="Tersedia">Tersedia</option>
                            <option value="Dipinjam">Dipinjam</option>
                            <option value="Tidak Tersedia">Tidak Tersedia</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                    <button type="button" class="btn btn-secondary" onclick="tutupForm('asset')">Cancel</button>
                </form>
            </div>
        </div>

        <!-- ================= MASTER MAHASISWA ================= -->
        <div id="page-mahasiswa" style="display: none;">
            <div class="table-container">
                <h1>Daftar Mahasiswa</h1>
                <button class="btn btn-primary mb-3" onclick="tambahMhs()">+ Add Data</button>
                <table id="tabel-mahasiswa" class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>NIM</th>
                            <th>Nama</th>
                            <th>Jurusan</th>
                            <th>Angkatan</th>
                            <th>Email</th>
                            <th>Telepon</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="form-container" id="box-mahasiswa">
                <h3 id="judul-mahasiswa">Tambah Mahasiswa</h3>
                <form id="form-mahasiswa">
                    <div class="mb-3">
                        <label class="form-label">NIM</label>
                        <input type="text" class="form-control" id="mhs-nim" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nama</label>
                        <input type="text" class="form-control" id="mhs-nama" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jurusan</label>
                        <input type="text" class="form-control" id="mhs-jurusan" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Angkatan</label>
                        <input type="number" class="form-control" id="mhs-angkatan" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="mhs-email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Telepon</label>
                        <input type="text" class="form-control" id="mhs-telepon" required>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                    <button type="button" class="btn btn-secondary" onclick="tutupForm('mahasiswa')">Cancel</button>
                </form>
            </div>
        </div>

        <!-- ================= TRANSAKSI PEMINJAMAN ================= -->
        <div id="page-peminjaman" style="display: none;">
            <div class="table-container">
                <h1>Daftar Peminjaman</h1>
                <button class="btn btn-primary mb-3" onclick="tambahPinjam()">+ Add Data</button>
                <table id="tabel-peminjaman" class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Mahasiswa</th>
                            <th>Asset</th>
                            <th>Jumlah</th>
                            <th>Tgl Pinjam</th>
                            <th>Tgl Kembali</th>
                            <th>Keterangan</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div class="form-container" id="box-peminjaman">
                <h3>Tambah Peminjaman</h3>
                <form id="form-peminjaman">
                    <div class="mb-3">
                        <label class="form-label">Mahasiswa</label>
                        <select class="form-control" id="pinjam-mhs" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Asset</label>
                        <select class="form-control" id="pinjam-asset" required></select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Jumlah</label>
                        <input type="number" class="form-control" id="pinjam-jumlah" min="1" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal Pinjam</label>
                        <input type="date" class="form-control" id="pinjam-tglpinjam" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tanggal Kembali</label>
                        <input type="date" class="form-control" id="pinjam-tglkembali" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Keterangan</label>
                        <input type="text" class="form-control" id="pinjam-ket" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select class="form-control" id="pinjam-status">
                            <option value="Pending">Pending</option>
                            <option value="Dipinjam">Dipinjam</option>
                            <option value="Dikembalikan">Dikembalikan</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success">Submit</button>
                    <button type="button" class="btn btn-secondary" onclick="tutupForm('peminjaman')">Cancel</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const base = 'https://api.melangkah.my.id';

        // simpan data terakhir yang diambil dari API
        let dataAsset = [];
        let dataMhs = [];

        // ================= FUNGSI BANTUAN =================
        // ambil data (GET), hasilnya diubah jadi array
        async function ambil(url) {
            let response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            let hasil = await response.json();
            if (Array.isArray(hasil)) return hasil;
            return Object.values(hasil).find(Array.isArray) || [];
        }

        // kirim data (POST / PUT / DELETE)
        function kirim(url, method, data) {
            return fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: data ? JSON.stringify(data) : undefined
            });
        }

        // update: di Postman pakai POST, kalau gagal dicoba PUT
        async function kirimUpdate(url, data) {
            let response = await kirim(url, 'POST', data);
            if (!response.ok) response = await kirim(url, 'PUT', data);
            return response;
        }

        function showPage(nama) {
            let semua = ['asset', 'mahasiswa', 'peminjaman'];
            semua.forEach(n => {
                document.getElementById('page-' + n).style.display = (n == nama) ? 'block' : 'none';
                document.getElementById('tab-' + n).classList.toggle('active', n == nama);
            });

            if (nama == 'asset') getAsset();
            if (nama == 'mahasiswa') getMhs();
            if (nama == 'peminjaman') getPinjam();
        }

        function tutupForm(nama) {
            document.getElementById('box-' + nama).style.display = 'none';
        }

        // ================= ASSET =================
        async function getAsset() {
            let tbody = document.querySelector('#tabel-asset tbody');
            try {
                dataAsset = await ambil(base + '/asset/read.php');
                tbody.innerHTML = '';
                dataAsset.forEach(a => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${a.id}</td>
                            <td>${a.nama_asset}</td>
                            <td>${a.kategori}</td>
                            <td>${a.jumlah}</td>
                            <td>${a.kondisi}</td>
                            <td>${a.lokasi}</td>
                            <td>${a.status}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editAsset(${a.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="hapusAsset(${a.id})">Delete</button>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                console.error('Gagal mengambil data asset:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">Tidak dapat mengambil data asset.</td></tr>';
            }
        }

        function tambahAsset() {
            document.getElementById('judul-asset').textContent = 'Tambah Asset';
            document.getElementById('form-asset').reset();
            delete document.getElementById('form-asset').dataset.id;
            document.getElementById('box-asset').style.display = 'block';
        }

        function editAsset(id) {
            let a = dataAsset.find(x => x.id == id);
            document.getElementById('judul-asset').textContent = 'Edit Asset';
            document.getElementById('asset-nama').value = a.nama_asset;
            document.getElementById('asset-kategori').value = a.kategori;
            document.getElementById('asset-jumlah').value = a.jumlah;
            document.getElementById('asset-kondisi').value = a.kondisi;
            document.getElementById('asset-lokasi').value = a.lokasi;
            document.getElementById('asset-status').value = a.status;
            document.getElementById('form-asset').dataset.id = id;
            document.getElementById('box-asset').style.display = 'block';
        }

        document.getElementById('form-asset').addEventListener('submit', async function (e) {
            e.preventDefault();
            let id = this.dataset.id;
            let data = {
                "nama_asset": document.getElementById('asset-nama').value,
                "kategori": document.getElementById('asset-kategori').value,
                "jumlah": Number(document.getElementById('asset-jumlah').value),
                "kondisi": document.getElementById('asset-kondisi').value,
                "lokasi": document.getElementById('asset-lokasi').value,
                "status": document.getElementById('asset-status').value
            };

            try {
                let response;
                if (id) {
                    data.id = Number(id);
                    response = await kirimUpdate(base + '/asset/update.php', data);
                } else {
                    response = await kirim(base + '/asset/create.php', 'POST', data);
                }
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                alert('Data asset berhasil disimpan!');
                tutupForm('asset');
                getAsset();
            } catch (error) {
                console.error('Gagal menyimpan asset:', error);
                alert('Gagal menyimpan data asset.');
            }
        });

        async function hapusAsset(id) {
            if (!confirm('Yakin mau menghapus asset ini?')) return;
            try {
                let response = await kirim(`${base}/asset/delete.php?id=${id}`, 'DELETE');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                alert('Asset berhasil dihapus!');
                getAsset();
            } catch (error) {
                console.error('Gagal menghapus asset:', error);
                alert('Gagal menghapus asset.');
            }
        }

        // ================= MAHASISWA =================
        async function getMhs() {
            let tbody = document.querySelector('#tabel-mahasiswa tbody');
            try {
                dataMhs = await ambil(base + '/mahasiswa/read.php');
                tbody.innerHTML = '';
                dataMhs.forEach(m => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${m.id}</td>
                            <td>${m.nim}</td>
                            <td>${m.nama}</td>
                            <td>${m.jurusan}</td>
                            <td>${m.angkatan}</td>
                            <td>${m.email}</td>
                            <td>${m.telepon}</td>
                            <td>
                                <button class="btn btn-warning btn-sm" onclick="editMhs(${m.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="hapusMhs(${m.id})">Delete</button>
                            </td>
                        </tr>`;
                });
            } catch (error) {
                console.error('Gagal mengambil data mahasiswa:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">Tidak dapat mengambil data mahasiswa.</td></tr>';
            }
        }

        function tambahMhs() {
            document.getElementById('judul-mahasiswa').textContent = 'Tambah Mahasiswa';
            document.getElementById('form-mahasiswa').reset();
            delete document.getElementById('form-mahasiswa').dataset.id;
            document.getElementById('box-mahasiswa').style.display = 'block';
        }

        function editMhs(id) {
            let m = dataMhs.find(x => x.id == id);
            document.getElementById('judul-mahasiswa').textContent = 'Edit Mahasiswa';
            document.getElementById('mhs-nim').value = m.nim;
            document.getElementById('mhs-nama').value = m.nama;
            document.getElementById('mhs-jurusan').value = m.jurusan;
            document.getElementById('mhs-angkatan').value = m.angkatan;
            document.getElementById('mhs-email').value = m.email;
            document.getElementById('mhs-telepon').value = m.telepon;
            document.getElementById('form-mahasiswa').dataset.id = id;
            document.getElementById('box-mahasiswa').style.display = 'block';
        }

        document.getElementById('form-mahasiswa').addEventListener('submit', async function (e) {
            e.preventDefault();
            let id = this.dataset.id;
            let data = {
                "nim": document.getElementById('mhs-nim').value,
                "nama": document.getElementById('mhs-nama').value,
                "jurusan": document.getElementById('mhs-jurusan').value,
                "angkatan": Number(document.getElementById('mhs-angkatan').value),
                "email": document.getElementById('mhs-email').value,
                "telepon": document.getElementById('mhs-telepon').value
            };

            try {
                let response;
                if (id) {
                    data.id = Number(id);
                    response = await kirimUpdate(base + '/mahasiswa/update.php', data);
                } else {
                    response = await kirim(base + '/mahasiswa/create.php', 'POST', data);
                }
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                alert('Data mahasiswa berhasil disimpan!');
                tutupForm('mahasiswa');
                getMhs();
            } catch (error) {
                console.error('Gagal menyimpan mahasiswa:', error);
                alert('Gagal menyimpan data mahasiswa.');
            }
        });

        async function hapusMhs(id) {
            if (!confirm('Yakin mau menghapus mahasiswa ini?')) return;
            try {
                let response = await kirim(`${base}/mahasiswa/delete.php?id=${id}`, 'DELETE');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                alert('Mahasiswa berhasil dihapus!');
                getMhs();
            } catch (error) {
                console.error('Gagal menghapus mahasiswa:', error);
                alert('Gagal menghapus mahasiswa.');
            }
        }

        // ================= PEMINJAMAN (Create & Read) =================
        // ambil data mahasiswa & asset untuk pilihan dropdown dan nama di tabel
        async function loadPilihan() {
            dataMhs = await ambil(base + '/mahasiswa/read.php');
            dataAsset = await ambil(base + '/asset/read.php');

            let optMhs = '<option value="">-- Pilih Mahasiswa --</option>';
            dataMhs.forEach(m => optMhs += `<option value="${m.id}">${m.nim} - ${m.nama}</option>`);
            document.getElementById('pinjam-mhs').innerHTML = optMhs;

            let optAsset = '<option value="">-- Pilih Asset --</option>';
            dataAsset.forEach(a => optAsset += `<option value="${a.id}">${a.nama_asset}</option>`);
            document.getElementById('pinjam-asset').innerHTML = optAsset;
        }

        async function getPinjam() {
            let tbody = document.querySelector('#tabel-peminjaman tbody');
            try {
                await loadPilihan();
                let data = await ambil(base + '/peminjaman/read.php');
                tbody.innerHTML = '';
                data.forEach(p => {
                    let mhs = dataMhs.find(m => m.id == p.id_mahasiswa);
                    let asset = dataAsset.find(a => a.id == p.id_asset);
                    tbody.innerHTML += `
                        <tr>
                            <td>${p.id_peminjaman}</td>
                            <td>${mhs ? mhs.nama : p.id_mahasiswa}</td>
                            <td>${asset ? asset.nama_asset : p.id_asset}</td>
                            <td>${p.jumlah}</td>
                            <td>${p.tanggal_pinjam}</td>
                            <td>${p.tanggal_kembali}</td>
                            <td>${p.keterangan}</td>
                            <td>${p.status_peminjaman}</td>
                        </tr>`;
                });
            } catch (error) {
                console.error('Gagal mengambil data peminjaman:', error);
                tbody.innerHTML = '<tr><td colspan="8" class="text-center">Tidak dapat mengambil data peminjaman.</td></tr>';
            }
        }

        function tambahPinjam() {
            document.getElementById('form-peminjaman').reset();
            document.getElementById('box-peminjaman').style.display = 'block';
        }

        document.getElementById('form-peminjaman').addEventListener('submit', async function (e) {
            e.preventDefault();
            let data = {
                "id_mahasiswa": Number(document.getElementById('pinjam-mhs').value),
                "id_asset": Number(document.getElementById('pinjam-asset').value),
                "jumlah": Number(document.getElementById('pinjam-jumlah').value),
                "tanggal_pinjam": document.getElementById('pinjam-tglpinjam').value,
                "tanggal_kembali": document.getElementById('pinjam-tglkembali').value,
                "keterangan": document.getElementById('pinjam-ket').value,
                "status_peminjaman": document.getElementById('pinjam-status').value
            };

            try {
                let response = await kirim(base + '/peminjaman/create.php', 'POST', data);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                alert('Peminjaman berhasil ditambahkan!');
                tutupForm('peminjaman');
                getPinjam();
            } catch (error) {
                console.error('Gagal menyimpan peminjaman:', error);
                alert('Gagal menyimpan data peminjaman.');
            }
        });

        // tampilkan halaman asset saat pertama dibuka
        getAsset();
    </script>
</body>

</html>
